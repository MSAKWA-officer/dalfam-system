<svg viewBox="0 0 1600 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b332b"/>
      <stop offset="55%" stop-color="#2f4a3c"/>
      <stop offset="100%" stop-color="#12241f"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3d98a"/>
      <stop offset="60%" stop-color="#c9a24b"/>
      <stop offset="100%" stop-color="#c9a24b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c5c4c"/>
      <stop offset="100%" stop-color="#2f4a3c"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26402f"/>
      <stop offset="100%" stop-color="#1c3327"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#173026"/>
      <stop offset="100%" stop-color="#0f2119"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="800" fill="url(#sky)"/>

  <!-- Sun glow -->
  <circle cx="1180" cy="230" r="280" fill="url(#sun)"/>
  <circle cx="1180" cy="230" r="90" fill="#e7c878"/>

  <!-- Birds -->
  <g stroke="#f7f5f0" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M220 140 q18 -20 36 0 q18 -20 36 0"/>
    <path d="M300 190 q14 -16 28 0 q14 -16 28 0"/>
    <path d="M760 110 q16 -18 32 0 q16 -18 32 0"/>
  </g>

  <!-- Far hills -->
  <path d="M0 480 Q200 400 420 460 T860 440 T1300 470 T1600 430 V800 H0 Z" fill="url(#hillFar)"/>

  <!-- Mid hills with a winding travel path -->
  <path d="M0 560 Q260 480 540 540 T1040 520 T1600 545 V800 H0 Z" fill="url(#hillMid)"/>
  <path d="M0 610 C300 540 420 640 700 580 S1150 560 1600 600" stroke="#c9a24b" stroke-width="10" fill="none" opacity="0.35" stroke-linecap="round"/>

  <!-- Near hills -->
  <path d="M0 660 Q320 590 660 650 T1280 630 T1600 655 V800 H0 Z" fill="url(#hillNear)"/>

  <!-- Simple tree cluster (left, tourism feel) -->
  <g fill="#0f2119" opacity="0.9">
    <circle cx="150" cy="600" r="46"/>
    <circle cx="205" cy="620" r="34"/>
    <rect x="145" y="620" width="10" height="46"/>
    <rect x="200" y="638" width="8" height="30"/>
  </g>

  <!-- Farm silhouette: simple barn (right side, breeding feel) -->
  <g fill="#0f2119" opacity="0.92">
    <polygon points="1330,660 1400,600 1470,660"/>
    <rect x="1340" y="660" width="120" height="70"/>
    <rect x="1385" y="690" width="30" height="40"/>
  </g>

  <!-- Stylised pig silhouette, centered low, subtle -->
  <g fill="#0f2119" opacity="0.9">
    <ellipse cx="820" cy="710" rx="62" ry="34"/>
    <circle cx="878" cy="694" r="24"/>
    <polygon points="892,676 906,668 900,684"/>
    <rect x="790" y="736" width="10" height="20"/>
    <rect x="812" y="738" width="10" height="20"/>
    <rect x="838" y="738" width="10" height="20"/>
    <rect x="860" y="736" width="10" height="20"/>
    <circle cx="892" cy="690" r="3" fill="#f7f5f0"/>
  </g>

  <!-- Foreground vignette for text contrast -->
  <rect width="1600" height="800" fill="url(#sky)" opacity="0"/>
</svg>
